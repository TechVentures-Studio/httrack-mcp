# Packages pushed with GITHUB_TOKEN inherit this repo's public visibility.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag/version (e.g. v1.0.1)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: echo "version=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: docker build -t ghcr.io/techventures-studio/httrack-mcp:${{ steps.ver.outputs.version }} -t ghcr.io/techventures-studio/httrack-mcp:latest .
      - name: Push image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/techventures-studio/httrack-mcp:${{ steps.ver.outputs.version }}
          docker push ghcr.io/techventures-studio/httrack-mcp:latest